spring:
  application:
    name: todolist-api
  datasource:
    url: jdbc:h2:file:./data/todolist-db
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console